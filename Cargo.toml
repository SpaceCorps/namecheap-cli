[package]
name = "namecheap-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "7.0.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.13.4", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
